name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Job 1: Compile Compact contract and run tests ──────────────────────────
  contract:
    name: Contract — Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install compact compiler
        run: |
          curl -L https://releases.midnight.network/compact/latest/compact-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/compact /usr/local/bin/compact
          compact --version

      - name: Install dependencies
        run: npm ci

      - name: Compile Compact contract
        run: |
          cd contract
          compact compile src/age_gate.compact ./src/managed/age-gate
          echo "Contract compiled successfully"
          ls src/managed/age-gate/

      - name: Type-check contract TypeScript
        run: |
          cd contract
          npx tsc -p tsconfig.json --noEmit

      - name: Run contract tests
        run: |
          cd contract
          npx vitest run --reporter=verbose

  # ── Job 2: Build and type-check the frontend ──────────────────────────────
  frontend:
    name: Frontend — Type-check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check frontend
        run: |
          cd bboard-ui
          npx tsc -p tsconfig.json --noEmit

      - name: Build frontend
        env:
          VITE_NETWORK: undeployed
          VITE_CONTRACT_ADDRESS: ''
          VITE_PROOF_SERVER_URL: http://localhost:6300
        run: |
          cd bboard-ui
          npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: bboard-ui/dist/
          retention-days: 7

  # ── Job 3: Type-check API and CLI ─────────────────────────────────────────
  api-cli:
    name: API & CLI — Type-check
    runs-on: ubuntu-latest
    needs: contract

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install compact compiler
        run: |
          curl -L https://releases.midnight.network/compact/latest/compact-linux-amd64.tar.gz | tar xz -C /tmp
          sudo mv /tmp/compact /usr/local/bin/compact

      - name: Install dependencies
        run: npm ci

      - name: Compile contract (needed for generated types)
        run: |
          cd contract
          compact compile src/age_gate.compact ./src/managed/age-gate

      - name: Type-check API
        run: |
          cd api
          npx tsc -p tsconfig.json --noEmit

      - name: Type-check CLI
        run: |
          cd bboard-cli
          npx tsc -p tsconfig.json --noEmit
